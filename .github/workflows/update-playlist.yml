name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install aiohttp aiofiles

      - name: Run the IPTV checker script
        run: |
          cd sources
          python iptv_smart_checker.py

      - name: Create Pull Request with updated playlist
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-update playlist from workflow"
          branch: playlist
          delete-branch: false
          base: main
          title: "Обновление плейлиста"
          body: "Автоматическое обновление IPTV плейлиста"
          assignees: medlexx
