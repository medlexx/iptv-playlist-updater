name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install aiohttp aiofiles

      - name: Run the IPTV checker script
        run: |
          cd sources
          python iptv_smart_checker.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sources/playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist from workflow" && git push)