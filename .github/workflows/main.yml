name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write  # Это разрешение все еще необходимо

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install aiohttp aiofiles

      - name: Run IPTV checker
        run: |
          python iptv_smart_checker.py

      # НОВЫЙ ШАГ: Публикуем файл playlist.m3u с помощью специального action
      - name: Deploy playlist.m3u to repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./          # Публикуем из корня репозитория
          publish_branch: main     # В ветку main
          destination_dir: .       # В корень ветки main
          keep_files: false        # Заменяем старый файл новым
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Auto-update playlist from workflow'
          # Указываем, какие файлы публиковать (только playlist.m3u)
          full_commit_message: 'Auto-update playlist from workflow'
