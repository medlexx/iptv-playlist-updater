name: Update IPTV Playlist

on:
  schedule:
    # Запуск по расписанию (каждые 6 часов)
    - cron: '0 0,6,12,18 * * *'
  # Возможность запуска вручную
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    # Ключевое изменение: явно даем права на запись в репозиторий
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Используем стандартный токен для аутентификации
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install aiohttp aiofiles

      - name: Run IPTV checker
        run: |
          python iptv_smart_checker.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Добавляем файл плейлиста в отслеживаемые
          git add playlist.m3u
          # Проверяем, есть ли изменения, и если есть — коммитим и пушим
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist $(date +'%Y-%m-%d %H:%M:%S')" && git push)
