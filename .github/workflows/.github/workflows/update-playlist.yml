# Имя вашего автоматизированного процесса
name: Update IPTV Playlist

# Триггеры для запуска:
on:
  # Запуск по расписанию (каждый день в 00:00, 06:00, 12:00 и 18:00 UTC)
  schedule:
    - cron: '0 0,6,12,18 * * *'
  # Возможность запустить вручную из интерфейса GitHub
  workflow_dispatch:

# Список задач (jobs)
jobs:
  update-playlist:
    # Запускать на виртуальной машине с Ubuntu (стандарт для Python-скриптов)
    runs-on: ubuntu-latest

    # Последовательность шагов (steps)
    steps:
      # 1. "Скачать" код из вашего репозитория на виртуальную машину
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Установить Python версии 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Установить все необходимые библиотеки из requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 4. Запустить ваш скрипт
      - name: Run the IPTV checker script
        run: |
          python iptv_smart_checker.py

      # 5. Сохранить изменения (если файл playlist.m3u обновился)
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update playlist from workflow"
          git push
